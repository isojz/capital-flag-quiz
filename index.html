<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首都＆国旗クイズ 30問</title>
<style>
  :root {
    --bg: #10142b;
    --panel: #1b2140;
    --cell: #242b52;
    --cell-press: #2f3868;
    --mint: #2ee6a8;
    --gold: #f5b433;
    --red: #ff6b7a;
    --green: #17604a;
    --green-line: #2ee6a8;
    --red-bg: #5a2333;
    --text: #eef0fb;
    --muted: #8f96bd;
    --line-soft: #2c3460;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg) !important; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 14px 40px;
    min-height: 100vh;
  }
  header { text-align: center; padding: 8px 0 4px; }
  h1 { font-size: 1.2rem; letter-spacing: .06em; font-weight: 800; }
  h1 .em { color: var(--gold); }
  .sub { color: var(--muted); font-size: .74rem; margin-top: 5px; letter-spacing: .04em; }

  /* ---- progress ---- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 10px;
  }
  .pbar-wrap { flex: 1; height: 8px; background: var(--cell); border-radius: 99px; overflow: hidden; }
  .pbar { height: 100%; width: 0; background: linear-gradient(90deg, var(--mint), var(--gold)); transition: width .3s ease; }
  .counter { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .counter b { color: var(--text); }
  .score-chip { font-size: .82rem; color: var(--mint); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- card ---- */
  .card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 18px 14px 16px;
    margin-top: 6px;
  }
  .qtype { text-align: center; font-size: .72rem; color: var(--muted); letter-spacing: .1em; margin-bottom: 10px; }
  .qtype b { color: var(--gold); }

  .flag-stage { display: flex; justify-content: center; margin: 2px 0 12px; }
  .flag-stage img {
    width: 180px; max-width: 62vw; height: auto;
    border-radius: 8px;
    border: 1px solid var(--line-soft);
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    background: #fff;
  }
  .capital-stage {
    text-align: center; margin: 6px 0 14px;
  }
  .capital-stage .cap {
    font-size: 1.9rem; font-weight: 800; color: var(--text);
    letter-spacing: .02em;
  }
  .capital-stage .hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }

  .ask { text-align: center; font-size: .95rem; font-weight: 700; margin-bottom: 12px; color: var(--text); }

  /* ---- text options (10択・コンパクト縦リスト) ---- */
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    background: var(--cell);
    border: 1.5px solid var(--line-soft);
    color: var(--text);
    border-radius: 11px;
    padding: 12px 14px;
    font-size: .96rem; font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: background .12s, border-color .12s, transform .05s;
    display: flex; align-items: center; gap: 10px;
  }
  .opt:active { transform: scale(.985); }
  .opt .badge { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; font-size: .7rem; color: var(--muted); }

  /* ---- flag options (10択・2列グリッド) ---- */
  .opts.flags { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts.flags .opt { padding: 8px; justify-content: center; }
  .opts.flags .opt img { width: 100%; height: auto; border-radius: 5px; background: #fff; pointer-events: none; display: block; }

  .opt.correct { background: var(--green); border-color: var(--green-line); }
  .opt.wrong { background: var(--red-bg); border-color: var(--red); }
  .opt.dim { opacity: .4; }
  .opt[disabled] { cursor: default; }

  /* ---- feedback + next ---- */
  .fb { text-align: center; min-height: 24px; margin: 16px 0 4px; font-weight: 800; font-size: 1rem; }
  .fb.ok { color: var(--mint); }
  .fb.ng { color: var(--red); }
  .fb .ans { display: block; font-size: .82rem; color: var(--muted); font-weight: 600; margin-top: 4px; }

  .btn {
    width: 100%;
    background: linear-gradient(90deg, var(--mint), #24c58f);
    color: #06251b;
    border: none; border-radius: 12px;
    padding: 15px; font-size: 1.02rem; font-weight: 800;
    cursor: pointer; letter-spacing: .04em;
    margin-top: 10px;
    transition: transform .05s, filter .12s;
  }
  .btn:active { transform: scale(.99); }
  .btn.ghost { background: var(--cell); color: var(--text); border: 1px solid var(--line-soft); }
  .btn:disabled { filter: grayscale(.5) brightness(.7); cursor: default; }

  /* ---- start / result ---- */
  .center-screen { text-align: center; padding: 30px 6px; }
  .center-screen .big { font-size: 3.2rem; margin-bottom: 8px; }
  .center-screen p { color: var(--muted); font-size: .9rem; line-height: 1.7; margin: 10px 0 22px; }
  .result-score { font-size: 3.4rem; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
  .result-score small { font-size: 1.3rem; color: var(--muted); font-weight: 700; }
  .result-msg { font-size: 1.05rem; font-weight: 800; margin: 6px 0 4px; }
  .result-rate { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }

  .review { text-align: left; margin-top: 22px; }
  .review h3 { font-size: .82rem; color: var(--muted); letter-spacing: .08em; margin-bottom: 10px; text-align: center; }
  .rv-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: 10px; padding: 9px 12px; margin-bottom: 8px;
  }
  .rv-item img { width: 44px; height: auto; border-radius: 4px; background: #fff; flex: none; }
  .rv-txt { font-size: .84rem; line-height: 1.45; }
  .rv-txt .cty { font-weight: 800; }
  .rv-txt .good { color: var(--mint); }
  .rv-txt .bad { color: var(--red); text-decoration: line-through; opacity: .8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌍 首都<span class="em">＆</span>国旗クイズ</h1>
    <div class="sub">ランダム30問 ・ 10択 ・ 似たものが紛れ込む</div>
  </header>

  <!-- START -->
  <section id="startScreen" class="center-screen">
    <div class="big">🗺️</div>
    <p>
      世界60カ国から<b style="color:var(--text)">ランダムに30問</b>。<br>
      「国旗 → 首都」と「首都 → 国旗」の2タイプ。<br>
      選択肢は<b style="color:var(--text)">10択</b>で、<br>
      <b style="color:var(--gold)">同じ地域の首都</b>や<b style="color:var(--gold)">似た国旗</b>を<br>わざと混ぜてくる。油断禁物。
    </p>
    <button class="btn" id="startBtn">スタート</button>
  </section>

  <!-- QUIZ -->
  <section id="quizScreen" class="hidden">
    <div class="topbar">
      <span class="counter"><b id="qNow">1</b> / 30</span>
      <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
      <span class="score-chip">⭐<span id="scoreNow">0</span></span>
    </div>

    <div class="card">
      <div class="qtype" id="qType"></div>
      <div id="stage"></div>
      <div class="ask" id="ask"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="btn hidden" id="nextBtn"></button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="resultScreen" class="hidden center-screen">
    <div class="result-score"><span id="finalScore">0</span><small> / 30</small></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-rate" id="resultRate"></div>
    <button class="btn" id="retryBtn">もう一度チャレンジ</button>
    <div class="review hidden" id="review">
      <h3>― まちがえた問題の復習 ―</h3>
      <div id="reviewList"></div>
    </div>
  </section>
</div>

<script>
/* ===== 国データ =====
   n:国名 / c:ISO2(小文字) / cap:首都
   region:地域(首都問題の「似た誘惑肢」用) / cont:大陸(補充用)
   flag:国旗の見た目タグ(国旗問題の「似た誘惑肢」用・複数可)
   複数首都/帰属で揉める国は良問にならないため意図的に除外。 */
const COUNTRIES = [
  // --- 東アジア ---
  { n:"日本", c:"jp", cap:"東京", region:"east_asia", cont:"asia", flag:["circle","sun"] },
  { n:"中国", c:"cn", cap:"北京", region:"east_asia", cont:"asia", flag:["red_star"] },
  { n:"韓国", c:"kr", cap:"ソウル", region:"east_asia", cont:"asia", flag:["white_field"] },
  { n:"モンゴル", c:"mn", cap:"ウランバートル", region:"east_asia", cont:"asia", flag:["red_blue"] },
  // --- 東南アジア ---
  { n:"タイ", c:"th", cap:"バンコク", region:"sea", cont:"asia", flag:["stripes_h"] },
  { n:"ベトナム", c:"vn", cap:"ハノイ", region:"sea", cont:"asia", flag:["red_star"] },
  { n:"インドネシア", c:"id", cap:"ジャカルタ", region:"sea", cont:"asia", flag:["red_white_h"] },
  { n:"フィリピン", c:"ph", cap:"マニラ", region:"sea", cont:"asia", flag:["blue_red"] },
  { n:"マレーシア", c:"my", cap:"クアラルンプール", region:"sea", cont:"asia", flag:["stripes_star","crescent"] },
  { n:"シンガポール", c:"sg", cap:"シンガポール", region:"sea", cont:"asia", flag:["red_white_h","crescent"] },
  // --- 南アジア ---
  { n:"インド", c:"in", cap:"ニューデリー", region:"south_asia", cont:"asia", flag:["tricolor_h","emblem"] },
  { n:"ネパール", c:"np", cap:"カトマンズ", region:"south_asia", cont:"asia", flag:["nonrect"] },
  { n:"パキスタン", c:"pk", cap:"イスラマバード", region:"south_asia", cont:"asia", flag:["crescent","green"] },
  { n:"バングラデシュ", c:"bd", cap:"ダッカ", region:"south_asia", cont:"asia", flag:["circle","green"] },
  // --- 中東・中央アジア ---
  { n:"サウジアラビア", c:"sa", cap:"リヤド", region:"mideast", cont:"asia", flag:["green","arabic"] },
  { n:"アラブ首長国連邦", c:"ae", cap:"アブダビ", region:"mideast", cont:"asia", flag:["pan_arab"] },
  { n:"イラン", c:"ir", cap:"テヘラン", region:"mideast", cont:"asia", flag:["tricolor_h","green"] },
  { n:"イラク", c:"iq", cap:"バグダッド", region:"mideast", cont:"asia", flag:["pan_arab","arabic"] },
  { n:"トルコ", c:"tr", cap:"アンカラ", region:"mideast", cont:"asia", flag:["crescent","red"] },
  { n:"カザフスタン", c:"kz", cap:"アスタナ", region:"c_asia", cont:"asia", flag:["blue","sun"] },
  // --- ヨーロッパ ---
  { n:"ロシア", c:"ru", cap:"モスクワ", region:"e_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"ドイツ", c:"de", cap:"ベルリン", region:"w_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"フランス", c:"fr", cap:"パリ", region:"w_europe", cont:"europe", flag:["tricolor_v"] },
  { n:"イギリス", c:"gb", cap:"ロンドン", region:"w_europe", cont:"europe", flag:["unionjack"] },
  { n:"イタリア", c:"it", cap:"ローマ", region:"s_europe", cont:"europe", flag:["tricolor_v"] },
  { n:"スペイン", c:"es", cap:"マドリード", region:"s_europe", cont:"europe", flag:["red_yellow"] },
  { n:"ポルトガル", c:"pt", cap:"リスボン", region:"s_europe", cont:"europe", flag:["green_red","emblem"] },
  { n:"オランダ", c:"nl", cap:"アムステルダム", region:"w_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"ベルギー", c:"be", cap:"ブリュッセル", region:"w_europe", cont:"europe", flag:["tricolor_v"] },
  { n:"スイス", c:"ch", cap:"ベルン", region:"w_europe", cont:"europe", flag:["cross_sq"] },
  { n:"オーストリア", c:"at", cap:"ウィーン", region:"w_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"スウェーデン", c:"se", cap:"ストックホルム", region:"n_europe", cont:"europe", flag:["nordic"] },
  { n:"ノルウェー", c:"no", cap:"オスロ", region:"n_europe", cont:"europe", flag:["nordic"] },
  { n:"デンマーク", c:"dk", cap:"コペンハーゲン", region:"n_europe", cont:"europe", flag:["nordic"] },
  { n:"フィンランド", c:"fi", cap:"ヘルシンキ", region:"n_europe", cont:"europe", flag:["nordic"] },
  { n:"ポーランド", c:"pl", cap:"ワルシャワ", region:"e_europe", cont:"europe", flag:["red_white_h"] },
  { n:"チェコ", c:"cz", cap:"プラハ", region:"e_europe", cont:"europe", flag:["triangle"] },
  { n:"ハンガリー", c:"hu", cap:"ブダペスト", region:"e_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"ギリシャ", c:"gr", cap:"アテネ", region:"s_europe", cont:"europe", flag:["stripes_blue"] },
  { n:"アイルランド", c:"ie", cap:"ダブリン", region:"w_europe", cont:"europe", flag:["tricolor_v"] },
  { n:"ウクライナ", c:"ua", cap:"キーウ", region:"e_europe", cont:"europe", flag:["blue_yellow"] },
  { n:"ルーマニア", c:"ro", cap:"ブカレスト", region:"e_europe", cont:"europe", flag:["tricolor_v"] },
  { n:"ブルガリア", c:"bg", cap:"ソフィア", region:"e_europe", cont:"europe", flag:["tricolor_h"] },
  { n:"クロアチア", c:"hr", cap:"ザグレブ", region:"e_europe", cont:"europe", flag:["tricolor_h","emblem"] },
  { n:"セルビア", c:"rs", cap:"ベオグラード", region:"e_europe", cont:"europe", flag:["tricolor_h","emblem"] },
  // --- 北米・中米 ---
  { n:"アメリカ合衆国", c:"us", cap:"ワシントンD.C.", region:"n_america", cont:"americas", flag:["stars_stripes"] },
  { n:"カナダ", c:"ca", cap:"オタワ", region:"n_america", cont:"americas", flag:["red_white_v","emblem"] },
  { n:"メキシコ", c:"mx", cap:"メキシコシティ", region:"n_america", cont:"americas", flag:["tricolor_v","emblem"] },
  { n:"キューバ", c:"cu", cap:"ハバナ", region:"n_america", cont:"americas", flag:["stars_stripes","triangle"] },
  // --- 南米 ---
  { n:"ブラジル", c:"br", cap:"ブラジリア", region:"s_america", cont:"americas", flag:["green","globe"] },
  { n:"アルゼンチン", c:"ar", cap:"ブエノスアイレス", region:"s_america", cont:"americas", flag:["stripes_blue","sun"] },
  { n:"チリ", c:"cl", cap:"サンティアゴ", region:"s_america", cont:"americas", flag:["stars_stripes"] },
  { n:"ペルー", c:"pe", cap:"リマ", region:"s_america", cont:"americas", flag:["red_white_v"] },
  { n:"コロンビア", c:"co", cap:"ボゴタ", region:"s_america", cont:"americas", flag:["stripes_yellow"] },
  { n:"ベネズエラ", c:"ve", cap:"カラカス", region:"s_america", cont:"americas", flag:["tricolor_h_yellow"] },
  // --- アフリカ ---
  { n:"エジプト", c:"eg", cap:"カイロ", region:"africa", cont:"africa", flag:["pan_arab"] },
  { n:"ナイジェリア", c:"ng", cap:"アブジャ", region:"africa", cont:"africa", flag:["tricolor_v_green"] },
  { n:"ケニア", c:"ke", cap:"ナイロビ", region:"africa", cont:"africa", flag:["pan_africa","stripes_h"] },
  { n:"エチオピア", c:"et", cap:"アディスアベバ", region:"africa", cont:"africa", flag:["pan_africa","emblem"] },
  { n:"モロッコ", c:"ma", cap:"ラバト", region:"africa", cont:"africa", flag:["red","star"] },
  { n:"アルジェリア", c:"dz", cap:"アルジェ", region:"africa", cont:"africa", flag:["crescent","green"] },
  { n:"ガーナ", c:"gh", cap:"アクラ", region:"africa", cont:"africa", flag:["pan_africa","star"] },
  // --- オセアニア ---
  { n:"オーストラリア", c:"au", cap:"キャンベラ", region:"oceania", cont:"oceania", flag:["unionjack"] },
  { n:"ニュージーランド", c:"nz", cap:"ウェリントン", region:"oceania", cont:"oceania", flag:["unionjack"] }
];

const TOTAL = 30;
const CHOICES = 10;       // 選択肢の数
const DISTRACT = CHOICES - 1;
const flagUrl = (code, w) => `https://flagcdn.com/w${w||320}/${code}.png`;

// --- utils ---
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* 似た誘惑肢を優先して n 個集める。
   tiers = [最優先候補, 次点, 全体] の順に、足りるまで詰める。 */
function pickDistractors(correct, n, type){
  const pool = COUNTRIES.filter(x => x.c !== correct.c);
  let tiers;
  if(type === "cap2flag"){
    // 国旗を当てる → 見た目が似た国旗を優先
    const sameFlag = pool.filter(x => x.flag.some(f => correct.flag.includes(f)));
    const sameCont = pool.filter(x => x.cont === correct.cont);
    tiers = [sameFlag, sameCont, pool];
  } else {
    // 首都を当てる → 同じ地域の首都を優先
    const sameRegion = pool.filter(x => x.region === correct.region);
    const sameCont   = pool.filter(x => x.cont === correct.cont);
    tiers = [sameRegion, sameCont, pool];
  }
  const chosen = [], seen = new Set();
  for(const tier of tiers){
    for(const item of shuffle(tier)){
      if(chosen.length >= n) break;
      if(seen.has(item.c)) continue;
      seen.add(item.c); chosen.push(item);
    }
    if(chosen.length >= n) break;
  }
  return chosen.slice(0, n);
}

// --- state ---
let questions = [];
let idx = 0, score = 0, answered = false;
const wrongs = [];

function buildQuestions(){
  const targets = shuffle(COUNTRIES).slice(0, TOTAL);
  return targets.map(country => {
    const type = (Math.random() < 0.5) ? "flag2cap" : "cap2flag";
    const distractors = pickDistractors(country, DISTRACT, type);
    const options = shuffle([country, ...distractors]);
    return { country, type, options };
  });
}

// --- DOM ---
const $ = id => document.getElementById(id);
const startScreen = $("startScreen"), quizScreen = $("quizScreen"), resultScreen = $("resultScreen");

function startQuiz(){
  questions = buildQuestions();
  idx = 0; score = 0; wrongs.length = 0;
  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = questions[idx];
  const { country, type, options } = q;

  $("qNow").textContent = idx+1;
  $("scoreNow").textContent = score;
  $("pbar").style.width = (idx/TOTAL*100) + "%";
  $("fb").textContent = ""; $("fb").className = "fb";
  $("nextBtn").classList.add("hidden");
  window.scrollTo(0, 0);

  const stage = $("stage"), opts = $("opts");
  opts.innerHTML = "";

  if(type === "flag2cap"){
    $("qType").innerHTML = "国旗を見て <b>首都</b> を当てる";
    stage.innerHTML = `<div class="flag-stage"><img src="${flagUrl(country.c,320)}" alt="国旗"
        onerror="this.style.opacity=.3;this.alt='画像読込失敗'"></div>`;
    $("ask").textContent = "この国の首都は？";
    opts.className = "opts";
    options.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="badge">●</span><span>${o.cap}</span>`;
      b.onclick = () => choose(b, o, country, opts);
      opts.appendChild(b);
    });
  } else {
    $("qType").innerHTML = "首都を見て <b>国旗</b> を当てる";
    stage.innerHTML = `<div class="capital-stage"><div class="cap">${country.cap}</div>
        <div class="hint">が首都の国は？</div></div>`;
    $("ask").textContent = "";
    opts.className = "opts flags";
    options.forEach(o => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<img src="${flagUrl(o.c,320)}" alt="${o.n}" onerror="this.style.opacity=.3">`;
      b.onclick = () => choose(b, o, country, opts);
      opts.appendChild(b);
    });
  }
}

function choose(btn, chosen, correct, opts){
  if(answered) return;
  answered = true;
  const isRight = (chosen.c === correct.c);
  if(isRight) score++;

  Array.from(opts.children).forEach((b, i) => {
    b.disabled = true;
    const o = questions[idx].options[i];
    if(o.c === correct.c) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = $("fb"), q = questions[idx];
  const ansText = (q.type === "flag2cap")
    ? `${correct.n} の首都は ${correct.cap}`
    : `${correct.cap} は ${correct.n} の首都`;
  if(isRight){
    fb.className = "fb ok";
    fb.innerHTML = `正解！ <span class="ans">${ansText}</span>`;
  } else {
    fb.className = "fb ng";
    fb.innerHTML = `残念… <span class="ans">正解：${ansText}</span>`;
    wrongs.push({ country: correct, chosen, type: q.type });
  }
  $("scoreNow").textContent = score;
  $("pbar").style.width = ((idx+1)/TOTAL*100) + "%";

  const nextBtn = $("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (idx < TOTAL-1) ? "次の問題 →" : "結果を見る 🏁";
}

function next(){
  idx++;
  if(idx >= TOTAL) showResult();
  else renderQuestion();
}

function showResult(){
  quizScreen.classList.add("hidden");
  resultScreen.classList.remove("hidden");
  window.scrollTo(0, 0);
  $("finalScore").textContent = score;

  const rate = Math.round(score/TOTAL*100);
  $("resultRate").textContent = `正答率 ${rate}%`;
  let msg;
  if(score === TOTAL) msg = "🏆 パーフェクト！地理の達人";
  else if(score >= 25) msg = "🎉 すばらしい！かなりの物知り";
  else if(score >= 18) msg = "👍 なかなかの成績";
  else if(score >= 10) msg = "📚 もう一歩、復習しよう";
  else msg = "🌱 これから覚えていこう";
  $("resultMsg").textContent = msg;

  const review = $("review"), list = $("reviewList");
  if(wrongs.length){
    list.innerHTML = "";
    wrongs.forEach(w => {
      const cty = w.country;
      const yourAns = (w.type === "flag2cap") ? w.chosen.cap : w.chosen.n;
      const item = document.createElement("div");
      item.className = "rv-item";
      item.innerHTML =
        `<img src="${flagUrl(cty.c,160)}" alt="${cty.n}" onerror="this.style.opacity=.3">
         <div class="rv-txt">
           <span class="cty">${cty.n}</span> ／ 首都 <span class="good">${cty.cap}</span><br>
           <span class="bad">あなたの回答：${yourAns}</span>
         </div>`;
      list.appendChild(item);
    });
    review.classList.remove("hidden");
  } else {
    review.classList.add("hidden");
  }
}

// --- events ---
$("startBtn").onclick = startQuiz;
$("retryBtn").onclick = startQuiz;
$("nextBtn").onclick = next;
</script>
</body>
</html>
